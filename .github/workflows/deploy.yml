name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_ACCESS_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/libply-backend:latest ./libply-bk
          docker push ${{ secrets.DOCKER_USERNAME }}/libply-backend:latest

      - name: Build and Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/libply-frontend:latest ./libply-ui --build-arg NEXT_PUBLIC_API_BASE_URL=/api
          docker push ${{ secrets.DOCKER_USERNAME }}/libply-frontend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v0.1.10
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: SUDO_PASSWORD
          script: |
            cd /srv/libply/libply-v1.04
            echo "SUDO_PASSWORD is: $SUDO_PASSWORD"
            echo "Setting SSH remote for parent"
            git remote set-url origin git@github.com:LibPly/libply-v1.04.git
            echo "Pulling parent repo"
            git pull origin main || echo "Failed to pull parent repo"
            echo "Syncing submodules"
            git submodule sync --recursive || echo "Submodule sync failed"
            git submodule update --init --recursive || echo "Submodule update failed"
            cd libply-infra
            echo "Setting SSH remote for libply-infra"
            git remote set-url origin git@github.com:LibPly/libply-infra.git
            echo "Updating libply-infra"
            git fetch origin || echo "Fetch failed for libply-infra"
            git checkout main || echo "Checkout main failed for libply-infra"
            git pull origin main || echo "Pull failed for libply-infra"
            cd ../libply-bk
            echo "Setting SSH remote for libply-bk"
            git remote set-url origin git@github.com:LibPly/libply-bk.git
            echo "Updating libply-bk"
            git checkout main || echo "Checkout main failed for libply-bk"
            git pull origin main || echo "Pull failed for libply-bk"
            cd ../libply-ui
            echo "Setting SSH remote for libply-ui"
            git remote set-url origin git@github.com:LibPly/libply-ui.git
            echo "Updating libply-ui"
            git checkout main || echo "Checkout main failed for libply-ui"
            git pull origin main || echo "Pull failed for libply-ui"
            cd ../libply-infra
            echo "$SUDO_PASSWORD" | sudo -S cp -L /etc/letsencrypt/live/libply.com/fullchain.pem certs/fullchain.pem
            echo "$SUDO_PASSWORD" | sudo -S cp -L /etc/letsencrypt/live/libply.com/privkey.pem certs/privkey.pem
            echo "$SUDO_PASSWORD" | sudo -S chown $USER certs/fullchain.pem certs/privkey.pem
            echo "$SUDO_PASSWORD" | sudo -S chmod 644 certs/fullchain.pem
            echo "$SUDO_PASSWORD" | sudo -S chmod 600 certs/privkey.pem
            cat > .env << EOL
            HTTP_PORT=${{ secrets.HTTP_PORT }}
            HTTPS_PORT=${{ secrets.HTTPS_PORT }}
            FRONTEND_PORT=3001
            BACKEND_PORT=8001
            NEXT_PUBLIC_API_BASE_URL=/api
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=db
            POSTGRES_PORT=5433
            DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}
            DEBUG=False
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_USE_SSL="${{ secrets.EMAIL_USE_SSL }}"
            EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}
            EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            SPOTIFY_REDIRECT_URI=${{ secrets.SPOTIFY_REDIRECT_URI }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            DJANGO_SETTINGS_MODULE=libply.settings.production
            JWT_ACCESS_TOKEN_LIFETIME=30
            JWT_REFRESH_TOKEN_LIFETIME=1
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            EOL
            echo "$SUDO_PASSWORD" | sudo -S cp /srv/libply/libply-v1.04/libply-infra/vps-nginx.conf /etc/nginx/sites-available/libply.com
            echo "$SUDO_PASSWORD" | sudo -S ln -sf /etc/nginx/sites-available/libply.com /etc/nginx/sites-enabled/libply.com
            echo "$SUDO_PASSWORD" | sudo -S nginx -t || (echo "Nginx config test failed" && exit 1)
            echo "$SUDO_PASSWORD" | sudo -S systemctl restart nginx || echo "Nginx restart failed"
            docker compose down
            docker pull ${{ secrets.DOCKER_USERNAME }}/libply-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/libply-frontend:latest
            docker compose up -d --build --force-recreate frontend backend db
            sleep 5  # Wait for backend to start
            docker cp $(docker ps -q -f name=libply-infra-backend):/libply-bk/staticfiles/. /srv/libply/libply-v1.04/libply-bk/staticfiles/
            docker image prune -f