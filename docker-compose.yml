services:
  backend:
    build: ./libply-bk
    
    command: >
      sh -c "
        echo 'Printing environment variables:' &&
        env | grep -E 'POSTGRES|DATABASE|DJANGO|SECRET_KEY|DEBUG|ALLOWED_HOSTS|JWT|CORS|AUTH_COOKIE' &&
        python manage.py migrate &&
        gunicorn --bind 0.0.0.0:8000 libply.wsgi:application
      "
    volumes:
      - ./libply-bk:/libply-bk
      - static_volume:/libply-bk/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./libply-bk/.env.development
    environment:
      - DJANGO_SETTINGS_MODULE=libply.settings.development
      - DOCKER_SETUP=true
      - POSTGRES_DB=libplydb
      - POSTGRES_USER=libplyuser
      - POSTGRES_PASSWORD=o_kx9ivq5NHFDdLw9IZSxGe7rgzCnGUnKWNFWBQbZcc
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - PYTHONPATH=/libply-bk
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - libply_network

  frontend:
    build:
      context: ./libply-ui
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
        - NEXT_PUBLIC_USE_MOCK_DATA=true
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
      - NEXT_PUBLIC_USE_MOCK_DATA=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - libply_network

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
      - ./postgres_logs:/var/log/postgresql
    environment:
      - POSTGRES_DB=libplydb
      - POSTGRES_USER=libplyuser
      - POSTGRES_PASSWORD=o_kx9ivq5NHFDdLw9IZSxGe7rgzCnGUnKWNFWBQbZcc
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libplyuser -d libplydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - libply_network
    command: >
      bash -c "
        echo 'POSTGRES_DB:' $$POSTGRES_DB
        echo 'POSTGRES_USER:' $$POSTGRES_USER
        echo 'POSTGRES_PASSWORD is set:' $${POSTGRES_PASSWORD:+true}
        docker-entrypoint.sh postgres
      "

volumes:
  postgres_data:
  static_volume:

networks:
  libply_network:
    driver: bridge